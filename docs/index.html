<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STR Prompt Framework - Ultimate LLM Blueprint</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="The Ultimate Open-Source Blueprint for LLMs using the Stage-Task-Rules (STR) Methodology.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* سفارشی‌سازی ظاهر برای پشتیبانی بهتر از زبان فارسی و انگلیسی */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .markdown-section {
      max-width: 850px;
    }
    /* استایل کادرهای پرامپت */
    core-prompt {
      background-color: #f8f9fa;
      border-left: 4px solid #42b983;
      padding: 15px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div id="app">Loading STR Framework Site...</div>
  <script>
    window.$docsify = {
      name: 'STR Framework 🚀',
      repo: 'https://github.com/AmirMotefaker/STR-Prompt-Framework',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: {
          '/': 'Search prompts... / جستجو پرامپت‌ها...'
        },
        noData: {
          '/': 'No results found! / نتیجه‌ای یافت نشد!'
        },
        depth: 6
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
