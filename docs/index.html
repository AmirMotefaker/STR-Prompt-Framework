<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STR Prompt Framework - Ultimate LLM Blueprint</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="The Ultimate Open-Source Blueprint for LLMs using the Stage-Task-Rules (STR) Methodology.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Theme: Vue (Clean & Professional) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* تنظیمات فونت و بهینه‌سازی نمایش متون فارسی و انگلیسی */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Vazirmatn", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .markdown-section {
      max-width: 850px;
      margin: 0 auto;
      padding: 30px 15px;
    }
    /* راست‌چین کردن خودکار متون فارسی برای خوانایی بهتر */
    .markdown-section h1:has(+ p:contains(/[\u0600-\u06FF]/)),
    .markdown-section p:contains(/[\u0600-\u06FF]/),
    .markdown-section li:contains(/[\u0600-\u06FF]/) {
      direction: rtl;
      text-align: right;
    }
    /* استایل اختصاصی برای بلوک‌های متنی پرامپت */
    pre code {
      font-family: "Fira Code", Consolas, Monaco, monospace !important;
      font-size: 0.9rem !important;
    }
    /* دکمه گیت‌هاب در گوشه صفحه */
    .github-corner svg {
      fill: #42b983;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="app">Loading STR Framework Site...</div>
  <script>
    window.$docsify = {
      name: 'STR Framework 🚀',
      repo: 'https://github.com/AmirMotefaker/STR-Prompt-Framework',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      
      // تنظیمات افزونه جستجوی دوزبانه
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: {
          '/': 'Search prompts... / جستجو پرامپت‌ها...'
        },
        noData: {
          '/': 'No results found! / نتیجه‌ای یافت نشد!'
        },
        depth: 6
      },
      
      // تنظیمات دکمه کپی کدها
      copyCode: {
        buttonText: {
          '/': 'Copy to Clipboard'
        },
        errorText: {
          '/': 'Error'
        },
        successText: {
          '/': 'Copied!'
        }
      }
    }
  </script>
  
  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- Plugins: Search, Copy Code & Custom Text Matching -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  
  <!-- پچ کوچک برای جستجوی بهتر متون حاوی کاراکترهای فارسی -->
  <script>
    if (window.jQuery) {
      $.expr[':'].contains = $.expr.createPseudo(function(arg) {
        return function(elem) {
          return $(elem).text().toUpperCase().indexOf(arg.toUpperCase()) >= 0;
        };
      });
    }
  </script>
</body>
</html>
